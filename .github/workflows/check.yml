name: Test tee time bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Saekja kodann
        uses: actions/checkout@v4

      - name: Setja upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Keyra botann
        run: python tee_time_bot.py

      - name: Testa Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"🏌️ Tee Time Bot virkar!"}' \
            "$DISCORD_WEBHOOK_URL"

      - name: Vista sidustu rastima
        run: |
          git config user.name "Tee Time Bot"
          git config user.email "bot@github.com"
          git add sidustu_timar.txt
          git diff --cached --quiet || git commit -m "Update tee time state"
          git push
          